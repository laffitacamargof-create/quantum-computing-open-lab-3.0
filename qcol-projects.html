<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCOL Proyectos · Laboratorio Cuántico · IA Bibliotecaria</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#010608;--s:#071220;--s2:#0c1c30;--b:#0d2a4a;--b2:#1a3a5c;--bl:#0088ff;--bl2:#00ccff;--gr:#00ff88;--gd:#ffd700;--rd:#ff4466;--tx:#ddeeff;--mu:#4a7a9b;--orb:'Orbitron',monospace;--mono:'JetBrains Mono',monospace;--exo:'Exo 2',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:var(--exo);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,136,255,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,136,255,.03)1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.notif{position:fixed;top:.8rem;right:.8rem;z-index:999;padding:.55rem 1rem;background:rgba(4,14,28,.97);border:1px solid var(--bl2);border-radius:8px;font-family:var(--orb);font-size:.6rem;color:var(--bl2);transform:translateX(130%);transition:transform .3s; backdrop-filter: blur(2px);}
.notif.show{transform:translateX(0);}
.admin-bar{display:none;background:rgba(255,215,0,.05);border-bottom:1px solid rgba(255,215,0,.15);padding:.5rem 1.3rem;font-family:var(--orb);font-size:.56rem;color:var(--gd);align-items:center;gap:.5rem;}
.admin-bar.show{display:flex;}
.toolbar{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.3rem;background:var(--s);border-bottom:1px solid var(--b);flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.search-box{display:flex;align-items:center;gap:.4rem;background:rgba(0,0,0,.35);border:1px solid var(--b2);border-radius:7px;padding:.32rem .7rem;flex:1;max-width:300px;}
.search-box input{background:transparent;border:none;color:var(--tx);font-family:var(--exo);font-size:.75rem;outline:none;width:100%;}
.search-box input::placeholder{color:var(--mu);}
.filter-btns{display:flex;gap:.3rem;}
.fbtn{padding:.28rem .65rem;background:transparent;border:1px solid var(--b2);border-radius:5px;color:var(--mu);font-family:var(--orb);font-size:.52rem;cursor:pointer;transition:all .2s;}
.fbtn.on{background:rgba(0,136,255,.15);border-color:var(--bl);color:var(--bl2);}
.btn{padding:.32rem .75rem;border:none;border-radius:6px;font-family:var(--orb);font-size:.55rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-pri{background:linear-gradient(135deg,#003388,var(--bl));color:#fff;}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,136,255,.4);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;text-align:center;gap:1.2rem;min-height:55vh;}
.empty-icon{font-size:3.5rem;opacity:.4;}
.empty-title{font-family:var(--orb);font-size:.95rem;color:var(--mu);}
.empty-desc{font-size:.74rem;color:var(--mu);max-width:380px;line-height:1.75;opacity:.7;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;padding:1.3rem;max-width:1200px;margin:0 auto;width:100%;}
.card{background:var(--s);border:1px solid var(--b);border-radius:13px;overflow:hidden;transition:all .3s;animation:fu .4s ease both;}
@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.card:hover{border-color:rgba(0,136,255,.5);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,136,255,.1);}
.card-hdr{padding:.75rem 1rem;background:var(--s2);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;}
.tbadge{font-family:var(--orb);font-size:.5rem;padding:.13rem .42rem;border-radius:4px;}
.tnb{background:rgba(0,136,255,.15);color:var(--bl2);border:1px solid rgba(0,136,255,.3);}
.tpdf{background:rgba(255,68,102,.12);color:#ff8899;border:1px solid rgba(255,68,102,.3);}
.tvid{background:rgba(0,255,136,.1);color:var(--gr);border:1px solid rgba(0,255,136,.3);}
.card-tags{font-family:var(--mono);font-size:.5rem;color:var(--mu);}
.card-body{padding:1rem;}
.card-title{font-family:var(--orb);font-size:.72rem;color:var(--tx);margin-bottom:.35rem;}
.card-desc{font-size:.68rem;color:var(--mu);line-height:1.65;margin-bottom:.8rem;}
.card-meta{display:flex;gap:.85rem;font-size:.6rem;color:var(--mu);margin-bottom:.75rem;font-family:var(--mono);}
.card-actions{display:flex;gap:.4rem;}
.btn-exec{flex:1;padding:.52rem;background:linear-gradient(135deg,rgba(0,136,255,.18),rgba(0,200,255,.08));border:1px solid rgba(0,136,255,.4);border-radius:7px;color:var(--bl2);font-family:var(--orb);font-size:.58rem;cursor:pointer;transition:all .2s;}
.btn-exec:hover{background:rgba(0,136,255,.28);}
.btn-del{padding:.52rem .65rem;background:rgba(255,68,102,.08);border:1px solid rgba(255,68,102,.2);border-radius:7px;color:#ff8899;font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.btn-del:hover{background:rgba(255,68,102,.18);}
.btn-edit{padding:.52rem .65rem;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);border-radius:7px;color:#88ffaa;font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.btn-edit:hover{background:rgba(0,255,136,.18);}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;align-items:center;justify-content:center;backdrop-filter: blur(3px);}
.modal-ov.open{display:flex;}
.modal{background:var(--s);border:1px solid rgba(0,136,255,.45);border-radius:14px;padding:1.7rem;width:min(500px,92vw);max-height:90vh;overflow-y:auto;animation:su .3s ease;}
@keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-title{font-family:var(--orb);font-size:.88rem;color:var(--bl2);margin-bottom:1.2rem;}
.fg{margin-bottom:.8rem;}
.fl{font-family:var(--orb);font-size:.52rem;color:var(--mu);letter-spacing:.1em;display:block;margin-bottom:.25rem;}
.fi{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--b2);border-radius:7px;padding:.5rem .8rem;color:var(--tx);font-family:var(--exo);font-size:.78rem;outline:none;}
.fi:focus{border-color:rgba(0,136,255,.7);}
select.fi{cursor:pointer;}
textarea.fi{resize:vertical;min-height:70px;line-height:1.6;}
.btn-row{display:flex;gap:.5rem;margin-top:.8rem;}
.btn-cancel{padding:.45rem .9rem;background:transparent;border:1px solid var(--b2);border-radius:7px;color:var(--mu);font-family:var(--orb);font-size:.58rem;cursor:pointer;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
/* Panel lateral IA y gestor archivos */
.main-layout{display:flex;max-width:1400px;margin:0 auto;gap:1rem;padding:0 1rem;}
.sidebar{width:300px;background:var(--s);border-right:1px solid var(--b);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;margin-top:.5rem;height:calc(100vh - 130px);position:sticky;top:70px;}
.sidebar-header{padding:.8rem;background:var(--s2);border-bottom:1px solid var(--b);font-family:var(--orb);font-size:.7rem;color:var(--bl2);display:flex;justify-content:space-between;align-items:center;}
.file-tree{padding:.5rem;overflow-y:auto;flex:1;font-size:.7rem;}
.file-item{padding:.3rem .5rem;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:.4rem;transition:all .1s;}
.file-item:hover{background:rgba(0,136,255,.1);}
.file-item.selected{background:rgba(0,136,255,.2);border-left:2px solid var(--bl);}
.folder{color:var(--gd);}
.file{color:var(--mu);}
.file-tree .indent{padding-left:1.2rem;}
.ai-chat{background:var(--s);border-top:1px solid var(--b);padding:.5rem;display:flex;flex-direction:column;gap:.5rem;max-height:280px;}
.chat-messages{height:180px;overflow-y:auto;font-size:.65rem;padding:.3rem;}
.chat-msg{background:rgba(0,136,255,.05);border-radius:8px;padding:.4rem .6rem;margin-bottom:.4rem;}
.chat-msg.user{background:rgba(0,255,136,.05);border-left:2px solid var(--gr);}
.chat-msg.ai{background:rgba(0,136,255,.05);border-left:2px solid var(--bl);}
.ai-input{display:flex;gap:.3rem;}
.ai-input input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--b2);border-radius:6px;padding:.35rem .5rem;color:var(--tx);font-size:.65rem;}
.btn-sm{padding:.25rem .6rem;font-size:.55rem;}
.action-buttons{display:flex;gap:.3rem;padding:.3rem .5rem;flex-wrap:wrap;border-bottom:1px solid var(--b);}
.content-area{flex:1;min-width:0;}
</style>
</head>
<body>
<div class="notif" id="notif"></div>
<div class="admin-bar" id="admin-bar">
  👑 Modo administrador — Gestiona proyectos del laboratorio
  <button class="btn btn-pri" style="margin-left:auto;" onclick="openAdd()">+ AGREGAR</button>
</div>
<div class="toolbar">
  <div class="search-box">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#4a7a9b" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="#4a7a9b" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" placeholder="Buscar proyectos..." oninput="render()">
  </div>
  <div class="filter-btns">
    <button class="fbtn on" onclick="setF('all',this)">Todo</button>
    <button class="fbtn" onclick="setF('nb',this)">Notebooks</button>
    <button class="fbtn" onclick="setF('pdf',this)">PDFs</button>
    <button class="fbtn" onclick="setF('video',this)">Videos</button>
  </div>
  <button class="btn btn-pri" onclick="openFileManager()" style="margin-left:auto;">📁 Gestor de Archivos</button>
</div>

<div class="main-layout">
  <div class="sidebar" id="file-sidebar" style="display:none;">
    <div class="sidebar-header">
      <span>📂 EXPLORADOR</span>
      <button class="btn-sm" onclick="closeFileManager()" style="background:transparent;">✕</button>
    </div>
    <div class="action-buttons">
      <button class="btn-sm" onclick="createNewFolder()">📁 + Carpeta</button>
      <button class="btn-sm" onclick="uploadFile()">📤 Subir</button>
      <button class="btn-sm" onclick="copySelected()">📋 Copiar</button>
      <button class="btn-sm" onclick="cutSelected()">✂️ Cortar</button>
      <button class="btn-sm" onclick="pasteHere()">📎 Pegar</button>
      <button class="btn-sm" onclick="deleteSelected()">🗑 Borrar</button>
    </div>
    <div class="file-tree" id="file-tree"></div>
    <div class="ai-chat">
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg ai">🤖 IA Bibliotecaria: Pregúntame sobre archivos, recomendaciones o busca contenido.</div>
      </div>
      <div class="ai-input">
        <input type="text" id="ai-query" placeholder="Ej: busca notebooks sobre Shor, recomiéndame PDFs..." onkeypress="if(event.key==='Enter') askAI()">
        <button class="btn-sm btn-pri" onclick="askAI()">Enviar</button>
      </div>
    </div>
  </div>
  <div class="content-area" id="content-area">
    <div id="content"></div>
  </div>
</div>

<!-- MODALES AGREGAR/EDITAR igual que antes pero añadimos lógica VFS -->
<div class="modal-ov" id="add-modal"><div class="modal"><div class="modal-title">➕ Agregar Proyecto</div><div class="fg"><label class="fl">TÍTULO</label><input class="fi" id="a-t"></div><div class="fg"><label class="fl">TIPO</label><select class="fi" id="a-type"><option value="pdf">PDF</option><option value="video">Video</option><option value="nb" class="opt-nb" style="display:none;">Notebook .ipynb</option></select></div><div class="fg"><label class="fl">ID</label><input class="fi" id="a-id"></div><div class="fg"><label class="fl">DESCRIPCIÓN</label><textarea class="fi" id="a-desc"></textarea></div><div class="fg"><label class="fl">TAGS</label><input class="fi" id="a-tags"></div><div class="g2"><div class="fg"><label class="fl">CELDAS/PÁG</label><input class="fi" id="a-size" type="number" value="10"></div><div class="fg"><label class="fl">TIEMPO (min)</label><input class="fi" id="a-time" type="number" value="15"></div></div><div class="btn-row"><button class="btn btn-pri" onclick="addProj()">✅ Guardar</button><button class="btn-cancel" onclick="closeAdd()">Cancelar</button></div></div></div>
<div class="modal-ov" id="edit-modal"><div class="modal"><div class="modal-title">✏️ Editar</div><div class="fg"><label class="fl">TÍTULO</label><input class="fi" id="e-t"></div><div class="fg"><label class="fl">TIPO</label><select class="fi" id="e-type"><option value="pdf">PDF</option><option value="video">Video</option><option value="nb" class="opt-nb-edit" style="display:none;">Notebook</option></select></div><div class="fg"><label class="fl">ID</label><input class="fi" id="e-id" readonly></div><div class="fg"><label class="fl">DESC</label><textarea class="fi" id="e-desc"></textarea></div><div class="fg"><label class="fl">TAGS</label><input class="fi" id="e-tags"></div><div class="g2"><div class="fg"><label class="fl">CELDAS/PÁG</label><input class="fi" id="e-size" type="number"></div><div class="fg"><label class="fl">TIEMPO</label><input class="fi" id="e-time" type="number"></div></div><div class="btn-row"><button class="btn btn-pri" onclick="updateProj()">💾 Guardar</button><button class="btn-cancel" onclick="closeEdit()">Cancelar</button></div></div></div>

<script>
// ==================== CONFIGURACIÓN INICIAL ====================
let curUser=null, isAdmin=false, isFounder=false, cfg={}, filt='all';
let editingProjId=null;
let vfs = { root: { type:'folder', name:'root', path:'/', children:['/proyectos'], modified:Date.now() }, '/proyectos':{ type:'folder', name:'proyectos', parent:'/', children:[] } };
let clipboard = { mode:null, items:[] };
let selectedPath = null;

function postCore(t,d={}){window.parent.postMessage({type:t,...d},'*');}
function notify(msg){const n=document.getElementById('notif');n.textContent=msg;n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),3000);postCore('QCOL_NOTIFY',{msg});}
window.addEventListener('message',e=>{const d=e.data;if(!d?.type)return;if(d.type==='QCOL_CONFIG'){cfg=d;}if(d.type==='QCOL_USER_UPDATE'){curUser=d.user;isAdmin=(curUser?.role==='admin'||curUser?.role==='founder');isFounder=(curUser?.role==='founder');document.querySelectorAll('.opt-nb,.opt-nb-edit').forEach(o=>o.style.display=isAdmin?'':'none');document.getElementById('admin-bar').classList.toggle('show',isAdmin);render();}});
postCore('QCOL_GET_CONFIG');

function getP(){return JSON.parse(localStorage.getItem('qcol_projs')||'[]');}
function saveP(p){localStorage.setItem('qcol_projs',JSON.stringify(p));}
function setF(f,el){filt=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');render();}

// ==================== VFS + GESTOR ARCHIVOS ====================
function loadVFS(){const saved=localStorage.getItem('qcol_vfs');if(saved){vfs=JSON.parse(saved);}else{saveVFS();}}
function saveVFS(){localStorage.setItem('qcol_vfs',JSON.stringify(vfs));}
function getNode(path){return vfs[path];}
function createFolder(path,name){const newPath=path==='/'?`/${name}`:`${path}/${name}`;if(vfs[newPath]){notify('Ya existe');return false;}vfs[newPath]={type:'folder',name,parent:path,children:[],modified:Date.now()};if(vfs[path]?.children)vfs[path].children.push(newPath);saveVFS();renderFileTree();return true;}
function deleteItem(path){if(!isFounder){notify('Solo founder puede borrar');return;}if(path==='/'||path==='/proyectos'){notify('No se puede borrar raíz');return;}const node=vfs[path];if(!node)return;if(node.type==='folder'){for(const child of [...(node.children||[])])deleteItem(child);}delete vfs[path];const parent=vfs[node.parent];if(parent?.children)parent.children=parent.children.filter(p=>p!==path);saveVFS();renderFileTree();notify(`Eliminado ${path}`);if(selectedPath===path)selectedPath=null;}
function copyItem(path){clipboard={mode:'copy',items:[path]};notify('Copiado');}
function cutItem(path){clipboard={mode:'cut',items:[path]};notify('Cortado');}
function pasteItem(destPath){if(!clipboard.items||clipboard.items.length===0)return;for(const src of clipboard.items){const srcNode=vfs[src];if(!srcNode)continue;const newName=srcNode.name;let newPath=destPath==='/'?`/${newName}`:`${destPath}/${newName}`;let counter=1;while(vfs[newPath]){newPath=destPath==='/'?`/${newName}_${counter}`:`${destPath}/${newName}_${counter}`;counter++;}if(clipboard.mode==='copy'){vfs[newPath]={...srcNode,parent:destPath,name:newName,path:newPath};if(srcNode.type==='folder')vfs[newPath].children=[...srcNode.children];if(vfs[destPath]?.children)vfs[destPath].children.push(newPath);}else if(clipboard.mode==='cut'){vfs[newPath]={...srcNode,parent:destPath,name:newName,path:newPath};delete vfs[src];const oldParent=vfs[srcNode.parent];if(oldParent?.children)oldParent.children=oldParent.children.filter(p=>p!==src);if(vfs[destPath]?.children)vfs[destPath].children.push(newPath);}}saveVFS();clipboard=null;renderFileTree();notify('Pegado');}
function uploadFile(){if(!isAdmin){notify('Solo admin puede subir');return;}const input=document.createElement('input');input.type='file';input.onchange=async(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const destPath=selectedPath||'/proyectos';const newPath=destPath==='/'?`/${file.name}`:`${destPath}/${file.name}`;vfs[newPath]={type:'file',name:file.name,ext:file.name.split('.').pop(),size:file.size,content:reader.result,parent:destPath,modified:Date.now()};if(vfs[destPath]?.children)vfs[destPath].children.push(newPath);saveVFS();renderFileTree();notify(`Subido ${file.name}`);};reader.readAsDataURL(file);};input.click();}
function renderFileTree(){const container=document.getElementById('file-tree');if(!container)return;function renderNode(path,level=0){const node=vfs[path];if(!node)return'';const indent='<div class="indent" style="padding-left:'+(level*12)+'px">';const icon=node.type==='folder'?'📁':'📄';const cls=node.type==='folder'?'folder':'file';const selectedClass=selectedPath===path?'selected':'';let html=`${indent}<div class="file-item ${selectedClass}" onclick="selectPath('${path}')"><span>${icon}</span><span class="${cls}">${node.name}</span></div>`;if(node.type==='folder' && node.children){for(const child of node.children){html+=renderNode(child,level+1);}}return html+`${level>0?'</div>':''}`;}container.innerHTML=renderNode('/');}
function selectPath(path){selectedPath=path;renderFileTree();}
function deleteSelected(){if(selectedPath)deleteItem(selectedPath);}
function copySelected(){if(selectedPath)copyItem(selectedPath);}
function cutSelected(){if(selectedPath)cutItem(selectedPath);}
function pasteHere(){if(selectedPath)pasteItem(selectedPath);}
function createNewFolder(){if(!isAdmin){notify('Solo admin puede crear carpetas');return;}const name=prompt('Nombre carpeta:');if(name)createFolder(selectedPath||'/proyectos',name);}
function openFileManager(){document.getElementById('file-sidebar').style.display='flex';renderFileTree();}
function closeFileManager(){document.getElementById('file-sidebar').style.display='none';}

// ==================== IA BIBLIOTECARIA ====================
function buildIndex(){const index={files:[],inverted:{}};for(const [path,node] of Object.entries(vfs)){if(node.type==='file'){const text=(node.name+(node.content||'')).toLowerCase();const words=text.match(/\w+/g)||[];index.files.push({path,name:node.name,size:node.size,words});for(const w of words){if(!index.inverted[w])index.inverted[w]=[];if(!index.inverted[w].includes(path))index.inverted[w].push(path);}}}return index;}
function searchFiles(query){const idx=buildIndex();const terms=query.toLowerCase().match(/\w+/g)||[];const scores={};for(const term of terms){if(idx.inverted[term]){for(const path of idx.inverted[term]){scores[path]=(scores[path]||0)+1;}}}return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([path])=>path);}
function recommendSimilar(filePath){const node=vfs[filePath];if(!node||node.type!=='file')return[];const words=new Set((node.name+(node.content||'')).toLowerCase().match(/\w+/g)||[]);const candidates=[];for(const [path,nd] of Object.entries(vfs)){if(nd.type==='file' && path!==filePath){const ndWords=new Set((nd.name+(nd.content||'')).toLowerCase().match(/\w+/g)||[]);let intersection=0;for(const w of words)if(ndWords.has(w))intersection++;candidates.push({path,score:intersection});}}return candidates.sort((a,b)=>b.score-a.score).slice(0,5).map(c=>c.path);}
async function askAI(){const query=document.getElementById('ai-query').value.trim();if(!query)return;const chatDiv=document.getElementById('chat-messages');chatDiv.innerHTML+=`<div class="chat-msg user">👤 ${escapeHtml(query)}</div>`;document.getElementById('ai-query').value='';chatDiv.scrollTop=chatDiv.scrollHeight;let response='';if(query.toLowerCase().includes('busca')||query.toLowerCase().includes('encuentra')||query.toLowerCase().includes('search')){const results=searchFiles(query);if(results.length){response=`🔍 Encontré estos archivos relacionados:<br>${results.map(p=>`📄 ${vfs[p]?.name}`).join('<br>')}`;}else{response='No encontré archivos relacionados con esa búsqueda.';}}else if(query.toLowerCase().includes('recomienda')||query.toLowerCase().includes('sugiere')){if(selectedPath && vfs[selectedPath]?.type==='file'){const recs=recommendSimilar(selectedPath);if(recs.length){response=`📚 Basado en ${vfs[selectedPath].name}, recomiendo:<br>${recs.map(p=>`📄 ${vfs[p]?.name}`).join('<br>')}`;}else{response='No hay recomendaciones similares en este momento.';}}else{response='Selecciona un archivo para obtener recomendaciones.';}}else if(query.toLowerCase().includes('leer')||query.toLowerCase().includes('contenido')){if(selectedPath && vfs[selectedPath]?.type==='file'){const contentPreview=vfs[selectedPath].content?.substring(0,300)||'Sin vista previa';response=`📖 Contenido de ${vfs[selectedPath].name}:<br><small>${escapeHtml(contentPreview)}...</small>`;}else{response='Selecciona un archivo primero para leer su contenido.';}}else{const results=searchFiles(query);if(results.length){response=`📌 Archivos relevantes:<br>${results.map(p=>`📄 ${vfs[p]?.name}`).join('<br>)}`;}else{response='🤖 IA: No encontré información específica. Intenta con "busca X", "recomienda", o "lee archivo".';}}chatDiv.innerHTML+=`<div class="chat-msg ai">🤖 ${response}</div>`;chatDiv.scrollTop=chatDiv.scrollHeight;postCore('QCOL_NOTIFY',{msg:'IA ha respondido'});}
function escapeHtml(str){if(!str)return '';return str.replace(/[&<>]/g,function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;});}

// ==================== RENDER PROYECTOS + EXEC (modo exposición) ====================
function render(){const q=document.getElementById('search').value.toLowerCase();const all=getP().filter(p=>{const mf=filt==='all'||p.type===filt;const mq=!q||p.title.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)||(p.tags||'').toLowerCase().includes(q);return mf&&mq;});const c=document.getElementById('content');if(all.length===0){c.innerHTML=`<div class="empty"><div class="empty-icon">📂</div><div class="empty-title">${q?'Sin resultados':'Sin proyectos'}</div><div class="empty-desc">${q?'No se encontraron':isAdmin?'Agrega proyectos':'Espera proyectos'}</div></div>`;return;}c.innerHTML='<div class="grid">'+all.map(p=>{const tl=p.type==='nb'?'NOTEBOOK':p.type==='pdf'?'PDF':'VIDEO';const tc=p.type==='nb'?'tnb':p.type==='pdf'?'tpdf':'tvid';const meta=p.type==='nb'?`⚛ ${p.size||10} celdas ⏱ ${p.time||10} min`:p.type==='pdf'?`📄 ${p.size||10} pág ⏱ ${p.time||10} min`:`▶ Video ⏱ ${p.time||10} min`;const canDelete=isFounder;const canModify=isFounder;const delBtn=canDelete?`<button class="btn-del" onclick="delProj('${p.id}')">🗑</button>`:'';const editBtn=canModify?`<button class="btn-edit" onclick="editProj('${p.id}')">✏️</button>`:'';const execText=p.type==='nb'?'▶ EJECUTAR (exposición)':p.type==='pdf'?'📖 VER PDF':'▶ VER VIDEO';return`<div class="card"><div class="card-hdr"><span class="tbadge ${tc}">${tl}</span><span class="card-tags">${escapeHtml(p.tags||'')}</span></div><div class="card-body"><div class="card-title">${escapeHtml(p.title)}</div><p class="card-desc">${escapeHtml(p.desc||'')}</p><div class="card-meta">${meta}</div><div class="card-actions"><button class="btn-exec" onclick="execProj('${p.id}')">${execText}</button>${editBtn}${delBtn}</div></div></div>`;}).join('')+'</div>';}
function execProj(id){const projs=getP();const p=projs.find(x=>x.id===id);if(!p){notify('No encontrado');return;}if(p.type==='nb'){window.parent.postMessage({type:'QCOL_OPEN_NB_EXPOSITION',nb:p},'*');notify('Abriendo notebook en modo exposición (Arquitecto Pro)');}else if(p.type==='pdf'){const gh=cfg.ghUser||'laffitacamargof-create',repo=cfg.ghRepo||'quantum-computing-open-lab';window.open(`https://github.com/${gh}/${repo}/blob/main/docs/${id}.pdf`,'_blank');}else if(p.type==='video'){notify('Video: '+p.title);}}
function delProj(id){if(!isFounder){notify('Solo founder puede eliminar');return;}if(confirm('¿Eliminar?')){saveP(getP().filter(x=>x.id!==id));notify('Eliminado');render();}}
function openAdd(){if(!isAdmin){notify('Solo admin');return;}document.getElementById('add-modal').classList.add('open');}
function closeAdd(){document.getElementById('add-modal').classList.remove('open');}
function addProj(){if(!isAdmin)return;const t=document.getElementById('a-t').value.trim(),id=document.getElementById('a-id').value.trim().replace(/\s/g,'_').toLowerCase(),type=document.getElementById('a-type').value,desc=document.getElementById('a-desc').value.trim(),tags=document.getElementById('a-tags').value.trim(),size=parseInt(document.getElementById('a-size').value)||10,time=parseInt(document.getElementById('a-time').value)||15;if(!t||!id){notify('Título e ID requeridos');return;}const all=getP();if(all.find(p=>p.id===id)){notify('ID existe');return;}all.push({id,title:t,type,desc,tags,size,time,added:new Date().toLocaleDateString()});saveP(all);closeAdd();notify('✅ Agregado');render();}
function editProj(id){if(!isFounder)return;const p=getP().find(x=>x.id===id);if(!p)return;editingProjId=id;document.getElementById('e-t').value=p.title;document.getElementById('e-type').value=p.type;document.getElementById('e-id').value=p.id;document.getElementById('e-desc').value=p.desc||'';document.getElementById('e-tags').value=p.tags||'';document.getElementById('e-size').value=p.size||10;document.getElementById('e-time').value=p.time||15;document.getElementById('edit-modal').classList.add('open');}
function closeEdit(){document.getElementById('edit-modal').classList.remove('open');editingProjId=null;}
function updateProj(){if(!isFounder)return;const newTitle=document.getElementById('e-t').value.trim();const newType=document.getElementById('e-type').value;const newDesc=document.getElementById('e-desc').value.trim();const newTags=document.getElementById('e-tags').value.trim();const newSize=parseInt(document.getElementById('e-size').value)||10;const newTime=parseInt(document.getElementById('e-time').value)||15;if(!newTitle){notify('Título requerido');return;}let projects=getP();const index=projects.findIndex(p=>p.id===editingProjId);if(index===-1)return;projects[index]={...projects[index],title:newTitle,type:newType,desc:newDesc,tags:newTags,size:newSize,time:newTime};saveP(projects);closeEdit();notify('Actualizado');render();}
document.getElementById('add-modal').addEventListener('click',e=>{if(e.target===document.getElementById('add-modal'))closeAdd();});
document.getElementById('edit-modal').addEventListener('click',e=>{if(e.target===document.getElementById('edit-modal'))closeEdit();});
loadVFS();renderFileTree();render();
</script>
