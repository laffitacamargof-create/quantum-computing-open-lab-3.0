<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCOL — Arquitecto Profesional</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;600&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Módulo 4 — CDNs para Markdown + Highlight.js + MathJax -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/dist/highlight.min.js"></script>
<style>
:root{
  --bg:#0a0e1a;--bg2:#0d1117;--bg3:#0d1220;
  --p:#111827;--p2:#1a2540;
  --bd:#1e3058;--bd2:#254070;
  --bl:#0088ff;--bl2:#00aaff;--cy:#00ffdd;
  --gr:#00ff88;--yw:#ffd700;--rd:#ff4466;--pu:#bd93f9;
  --tx:#e2ecff;--tx2:#aabcda;--mu:#4a6a9a;--mu2:#2a3a5a;
  --kw:#ff79c6;--fn:#50fa7b;--st:#f1fa8c;--nm:#bd93f9;--cm:#636e8a;--cl:#8be9fd;
  --orb:'Orbitron',monospace;--mono:'JetBrains Mono',monospace;--ex:'Exo 2',sans-serif;
  --cell-run:#0088ff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--ex);}
body{display:flex;flex-direction:column;overflow:hidden;}

/* ── NOTIF ── */
.notif{position:fixed;top:.7rem;right:.7rem;z-index:9999;padding:.5rem .9rem;
  background:rgba(10,14,26,.97);border:1px solid var(--cy);border-radius:8px;
  font-family:var(--orb);font-size:.58rem;color:var(--cy);
  transform:translateX(130%);transition:transform .3s;pointer-events:none;}
.notif.show{transform:translateX(0);}

/* ── ACCESS DENIED ── */
.access-denied{display:none;position:fixed;inset:0;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;z-index:100;
  text-align:center;gap:1.2rem;}
.access-denied.show{display:flex;}
.denied-icon{font-size:3rem;opacity:.4;}
.denied-title{font-family:var(--orb);font-size:1rem;color:var(--rd);}
.denied-desc{font-size:.75rem;color:var(--mu);max-width:340px;line-height:1.7;}
.btn-back{padding:.48rem 1.1rem;background:linear-gradient(135deg,#003388,var(--bl));
  border:none;border-radius:8px;color:#fff;font-family:var(--orb);font-size:.65rem;cursor:pointer;}

/* ── TOP BAR — mínima ── */
.topbar{
  height:38px;display:flex;align-items:center;gap:.5rem;
  padding:0 .8rem;background:#080b14;
  border-bottom:1px solid rgba(189,147,249,.18);flex-shrink:0;
  position:relative;z-index:10;
}
.tb-logo{display:flex;align-items:center;gap:.35rem;margin-right:.5rem;}
.tb-q{font-family:var(--orb);font-size:.72rem;font-weight:900;color:var(--cy);}
.tb-pro{font-family:var(--orb);font-size:.48rem;color:var(--pu);letter-spacing:.06em;}
.tb-sep{width:1px;height:18px;background:var(--bd);flex-shrink:0;}
.nb-name-inp{
  background:transparent;border:none;outline:none;
  font-family:var(--mono);font-size:.72rem;color:var(--tx);
  min-width:80px;max-width:220px;padding:.1rem .3rem;
  border-radius:4px;cursor:text;
}
.nb-name-inp:focus{background:rgba(255,255,255,.05);color:var(--cy);}
.nb-name-inp::placeholder{color:var(--mu);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:.3rem;}
/* Módulo 1 — input URL motor */
.engine-url-input{
  background:rgba(0,0,0,.5);border:1px solid var(--bd2);border-radius:6px;
  padding:.2rem .5rem;font-family:var(--mono);font-size:.55rem;
  color:var(--tx2);width:180px;outline:none;
}
.engine-url-input:focus{border-color:var(--bl2);color:var(--cy);}
.tbtn{
  display:flex;align-items:center;gap:.3rem;
  padding:.25rem .6rem;background:transparent;
  border:1px solid var(--bd2);border-radius:5px;
  color:var(--mu);font-family:var(--orb);font-size:.48rem;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tbtn:hover{border-color:var(--bl2);color:var(--bl2);background:rgba(0,136,255,.06);}
.tbtn.run{background:linear-gradient(135deg,#003388,var(--bl));border-color:var(--bl);color:#fff;}
.tbtn.run:hover{box-shadow:0 2px 10px rgba(0,136,255,.4);}
.tbtn.run-all{background:linear-gradient(135deg,#004400,#00aa44);border-color:#00aa44;color:#fff;}
.tbtn.pub{background:linear-gradient(135deg,#3a0075,var(--pu));border-color:var(--pu);color:#fff;}
.eng-pill{
  padding:.2rem .5rem;border-radius:12px;font-family:var(--orb);font-size:.44rem;
  background:rgba(74,106,154,.1);border:1px solid rgba(74,106,154,.25);color:var(--mu);
}
.eng-pill.on{background:rgba(0,255,136,.07);border-color:rgba(0,255,136,.35);color:var(--gr);
  animation:puls 2.5s infinite;}
@keyframes puls{0%,100%{border-color:rgba(0,255,136,.35);}50%{border-color:rgba(0,255,136,.8);}}
.user-pill{padding:.2rem .5rem;border-radius:12px;font-family:var(--orb);font-size:.46rem;
  background:rgba(189,147,249,.08);border:1px solid rgba(189,147,249,.2);color:var(--pu);}
.admin-pill{padding:.2rem .5rem;border-radius:12px;font-family:var(--orb);font-size:.44rem;
  background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);color:var(--yw);}

/* ── SECONDARY BAR — tabs ── */
.secbar{
  height:32px;display:flex;align-items:stretch;
  background:#080b14;border-bottom:1px solid var(--bd);flex-shrink:0;
  padding:0 .5rem;gap:.1rem;
}
.stab{
  display:flex;align-items:center;gap:.3rem;padding:0 .75rem;
  background:transparent;border:none;color:var(--mu);
  font-family:var(--orb);font-size:.48rem;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
}
.stab.on{color:var(--pu);border-bottom-color:var(--pu);}
.stab:hover:not(.on){color:var(--tx2);}
.secbar-right{margin-left:auto;display:flex;align-items:center;gap:.3rem;padding:0 .3rem;}

/* ── MAIN AREA ── */
.main{flex:1;overflow:hidden;display:flex;min-height:0;}

/* ── NOTEBOOK VIEW — estilo Colab ── */
#view-notebook{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);
}
.nb-scroll{
  flex:1;overflow-y:auto;padding:.8rem 0;
}
.nb-scroll::-webkit-scrollbar{width:5px;}
.nb-scroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px;}

/* ── CELDA — estilo Colab ── */
.nb-cell{
  display:flex;margin:.2rem auto;
  width:min(900px,96%);
  position:relative;
  border-radius:8px;
  border:1px solid transparent;
  transition:border-color .15s;
}
.nb-cell:hover{border-color:rgba(189,147,249,.15);}
.nb-cell.active{border-color:rgba(189,147,249,.4);}
.nb-cell.running{border-color:rgba(0,136,255,.5);}

.cell-gutter{
  width:52px;flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;padding:.6rem .3rem 0;
  gap:.3rem;
}
.cell-num{
  font-family:var(--mono);font-size:.6rem;color:var(--mu);
  min-width:22px;text-align:center;
}
.cell-run-btn{
  width:26px;height:26px;border-radius:50%;
  background:transparent;border:1px solid var(--bd2);
  color:var(--mu);font-size:.7rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.nb-cell.active .cell-run-btn{border-color:var(--bl2);color:var(--bl2);}
.cell-run-btn:hover{background:rgba(0,136,255,.15);border-color:var(--bl);color:var(--bl2);transform:scale(1.1);}
.cell-run-btn.spinning{border-color:var(--gr);color:var(--gr);animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.cell-body{
  flex:1;display:flex;flex-direction:column;
  min-width:0;padding:.4rem 0;
}

.cell-type-badge{
  display:inline-flex;align-items:center;gap:.3rem;
  font-family:var(--orb);font-size:.44rem;color:var(--mu);
  padding:.08rem 0 .3rem;margin-bottom:.1rem;
}
.ctb-code{color:var(--bl2);}
.ctb-md{color:var(--gr);}

.cell-code-area{
  position:relative;background:var(--bg2);
  border:1px solid var(--bd);border-radius:6px;
  overflow:hidden;min-height:48px;
}
.nb-cell.active .cell-code-area{border-color:rgba(189,147,249,.35);}
.cell-syn-layer{
  position:absolute;inset:0;padding:.6rem .8rem;
  font-family:var(--mono);font-size:.72rem;line-height:1.65;
  pointer-events:none;z-index:1;overflow:hidden;
  white-space:pre;color:var(--tx2);background:var(--bg2);
}
.cell-textarea{
  position:absolute;inset:0;
  background:transparent;color:transparent;caret-color:var(--cy);
  padding:.6rem .8rem;font-family:var(--mono);font-size:.72rem;
  border:none;outline:none;resize:none;line-height:1.65;
  z-index:2;white-space:pre;overflow:auto;tab-size:4;
  min-height:48px;
}
.cell-textarea::-webkit-scrollbar{width:4px;height:4px;}
.cell-textarea::-webkit-scrollbar-thumb{background:var(--bd2);}

/* Módulo 2 — output rico por celda */
.cell-output-area{
  margin-top:.35rem;
  background:#060a10;
  border:1px solid var(--bd);
  border-radius:6px;
  font-family:var(--mono);
  overflow:hidden;
}
.out-text{
  padding:.55rem .8rem;
  font-size:.68rem;
  line-height:1.65;
  white-space:pre-wrap;
  max-height:280px;
  overflow-y:auto;
  border-bottom:1px solid var(--bd);
  margin:0;
}
.out-text:empty{display:none;}
.out-circuit{
  width:100%;
  background:#0a0e1a;
  border-bottom:1px solid var(--bd);
  display:block;
}
.out-plot{
  max-width:100%;
  display:block;
  background:#0a0e1a;
  border-bottom:1px solid var(--bd);
}

/* Módulo 4 — markdown con dos paneles */
.md-split{
  display:flex;
  gap:.5rem;
  background:var(--bg2);
  border:1px solid var(--bd);
  border-radius:6px;
  min-height:150px;
}
.md-editor-pane{
  flex:1;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--bd);
}
.md-preview-pane{
  flex:1;
  padding:.6rem;
  overflow-y:auto;
  max-height:400px;
  font-size:.75rem;
  line-height:1.6;
  color:var(--tx2);
}
.md-preview-pane h1{font-family:var(--orb);font-size:1rem;color:var(--bl2);}
.md-preview-pane h2{font-size:.85rem;color:var(--bl2);}
.md-preview-pane code{background:rgba(0,136,255,.1);padding:.1rem .3rem;border-radius:3px;font-family:var(--mono);color:var(--cy);}
.md-preview-pane pre{background:var(--bg);padding:.5rem;border-radius:5px;overflow-x:auto;}
.md-preview-pane .hljs{background:transparent;}
.cell-md-split-area{
  width:100%;
  background:var(--bg2);
  border:none;
  padding:.6rem;
  font-family:var(--mono);
  font-size:.72rem;
  line-height:1.65;
  color:var(--tx2);
  resize:vertical;
  outline:none;
}

.cell-toolbar{
  display:none;position:absolute;top:.3rem;right:.5rem;
  gap:.2rem;align-items:center;z-index:5;
}
.nb-cell:hover .cell-toolbar,
.nb-cell.active .cell-toolbar{display:flex;}
.ct-btn{
  width:20px;height:20px;border-radius:4px;
  background:rgba(10,14,26,.85);border:1px solid var(--bd2);
  color:var(--mu);font-size:.55rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.ct-btn:hover{border-color:var(--bl2);color:var(--bl2);}
.ct-btn.danger:hover{border-color:var(--rd);color:var(--rd);}

.add-cell-row{
  width:min(900px,96%);margin:.05rem auto;height:18px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.add-cell-row:hover{opacity:1;}
.add-cell-line{flex:1;height:1px;background:rgba(189,147,249,.2);}
.add-cell-btns{display:flex;gap:.25rem;padding:0 .5rem;}
.add-btn{
  padding:.12rem .45rem;background:var(--bg);border:1px solid rgba(189,147,249,.3);
  border-radius:4px;color:var(--pu);font-family:var(--orb);font-size:.42rem;
  cursor:pointer;transition:all .15s;
}
.add-btn:hover{background:rgba(189,147,249,.08);}

.nb-bottom{
  width:min(900px,96%);margin:.5rem auto 2rem;
  display:flex;gap:.5rem;
}
.nb-add-big{
  flex:1;padding:.55rem;background:transparent;
  border:1px dashed rgba(189,147,249,.2);border-radius:8px;
  color:var(--pu);font-family:var(--orb);font-size:.52rem;
  cursor:pointer;transition:all .2s;text-align:center;
}
.nb-add-big:hover{background:rgba(189,147,249,.06);border-color:rgba(189,147,249,.5);}

/* ── GESTIONAR NOTEBOOKS ── */
#view-manage{display:none;flex:1;flex-direction:column;overflow:hidden;}
.manage-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.manage-bar{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;
  background:var(--p);border-bottom:1px solid var(--bd);flex-shrink:0;}
.manage-title-lbl{font-family:var(--orb);font-size:.68rem;color:var(--pu);}
.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:.85rem;padding:1.1rem;overflow-y:auto;flex:1;}
.nb-grid::-webkit-scrollbar{width:5px;}
.nb-grid::-webkit-scrollbar-thumb{background:var(--bd2);}
.nb-card{background:var(--p);border:1px solid var(--bd);border-radius:10px;
  overflow:hidden;transition:all .25s;}
.nb-card:hover{border-color:rgba(189,147,249,.4);box-shadow:0 6px 20px rgba(189,147,249,.07);}
.nb-card-hdr{padding:.65rem .9rem;background:#080b14;
  border-bottom:1px solid rgba(189,147,249,.15);
  display:flex;align-items:center;justify-content:space-between;}
.nb-card-title{font-family:var(--orb);font-size:.65rem;color:var(--tx);}
.nb-card-badge{font-family:var(--orb);font-size:.44rem;padding:.1rem .32rem;
  border-radius:4px;background:rgba(189,147,249,.1);
  border:1px solid rgba(189,147,249,.25);color:var(--pu);}
.nb-card-body{padding:.85rem;}
.nb-card-desc{font-size:.64rem;color:var(--mu);line-height:1.55;margin-bottom:.65rem;}
.nb-card-meta{font-family:var(--mono);font-size:.56rem;color:var(--mu2);margin-bottom:.6rem;}
.nb-card-actions{display:flex;gap:.3rem;}
.btn-edit-nb{flex:1;padding:.42rem;background:rgba(189,147,249,.1);
  border:1px solid rgba(189,147,249,.25);border-radius:6px;
  color:var(--pu);font-family:var(--orb);font-size:.52rem;cursor:pointer;transition:all .2s;}
.btn-edit-nb:hover{background:rgba(189,147,249,.2);}
.btn-pub-nb{flex:1;padding:.42rem;background:rgba(0,136,255,.1);
  border:1px solid rgba(0,136,255,.3);border-radius:6px;
  color:var(--bl2);font-family:var(--orb);font-size:.52rem;cursor:pointer;transition:all .2s;}
.btn-pub-nb:hover{background:rgba(0,136,255,.2);}
.btn-del-nb{padding:.42rem .55rem;background:rgba(255,68,102,.07);
  border:1px solid rgba(255,68,102,.18);border-radius:6px;
  color:#ff8899;font-family:var(--orb);font-size:.52rem;cursor:pointer;transition:all .2s;}
.btn-del-nb:hover{background:rgba(255,68,102,.15);}
.nb-empty-state{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;text-align:center;gap:.9rem;padding:2rem;}
.nb-empty-icon{font-size:2.5rem;opacity:.3;}
.nb-empty-ttl{font-family:var(--orb);font-size:.8rem;color:var(--mu);}
.nb-empty-sub{font-size:.68rem;color:var(--mu);opacity:.7;max-width:280px;line-height:1.6;}

/* ── STATUS BAR ── */
.statusbar{
  height:22px;display:flex;align-items:center;gap:.65rem;
  padding:0 .85rem;background:#060a10;border-top:1px solid var(--bd);
  font-family:var(--mono);font-size:.52rem;color:var(--mu);flex-shrink:0;
}
.sb-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.sb-idle{background:var(--mu);}
.sb-run{background:var(--gr);animation:puls 1.5s infinite;}
.sb-err{background:var(--rd);}
.sb-right{margin-left:auto;display:flex;gap:.65rem;}
#sb-save-status{color:var(--gr);}

.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);
  z-index:800;align-items:center;justify-content:center;}
.modal-ov.open{display:flex;}
.modal{background:var(--p);border:1px solid rgba(189,147,249,.35);
  border-radius:12px;padding:1.5rem;width:min(480px,92vw);}
.modal-title{font-family:var(--orb);font-size:.82rem;color:var(--pu);margin-bottom:1rem;}
.fg{margin-bottom:.7rem;}
.fl{font-family:var(--orb);font-size:.5rem;color:var(--mu);
  letter-spacing:.08em;display:block;margin-bottom:.2rem;}
.fi{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--bd2);
  border-radius:7px;padding:.45rem .72rem;color:var(--tx);
  font-family:var(--mono);font-size:.72rem;outline:none;}
.fi:focus{border-color:var(--pu);}
select.fi,textarea.fi{cursor:pointer;}
textarea.fi{resize:vertical;min-height:65px;line-height:1.5;}
.btn-row{display:flex;gap:.4rem;margin-top:.65rem;}
.btn-pri{padding:.4rem .9rem;background:linear-gradient(135deg,#4a0a8a,var(--pu));
  border:none;border-radius:6px;color:#fff;font-family:var(--orb);
  font-size:.56rem;cursor:pointer;}
.btn-cancel{padding:.4rem .85rem;background:transparent;
  border:1px solid var(--bd2);border-radius:7px;color:var(--mu);
  font-family:var(--orb);font-size:.54rem;cursor:pointer;}

.kw{color:var(--kw);font-weight:600;}.fn{color:var(--fn);}
.st{color:var(--st);}.nm{color:var(--nm);}.cm{color:var(--cm);font-style:italic;}
.cl{color:var(--cl);}

.nb-cell.drag-over{
  border-color:var(--cy)!important;
  box-shadow:0 0 0 2px rgba(0,255,221,.2);
}
.nb-cell[draggable]{cursor:grab;}
.nb-cell[draggable]:active{cursor:grabbing;}

@media(max-width:700px){
  .nb-cell{width:98%;}
  .nb-bottom{width:98%;}
  .add-cell-row{width:98%;}
  .cell-gutter{width:36px;}
  .topbar{padding:0 .5rem;gap:.25rem;}
  .tbtn span{display:none;}
}
</style>
</head>
<body>
<div class="notif" id="notif"></div>
<div class="access-denied" id="access-denied">
  <div class="denied-icon">🔒</div>
  <div class="denied-title">ACCESO RESTRINGIDO</div>
  <div class="denied-desc">Arquitecto Profesional es exclusivo para<br>
    <strong style="color:var(--pu);">Administradores</strong> y el
    <strong style="color:var(--yw);">Fundador</strong>.
  </div>
  <button class="btn-back" onclick="postCore('QCOL_NAV',{screen:'home'})">← Volver al menú</button>
</div>

<div class="topbar" id="topbar" style="display:none;">
  <div class="tb-logo">
    <span class="tb-q">Q</span><span style="font-family:var(--orb);font-size:.72rem;font-weight:900;color:var(--bl2);">COL</span>
    <span class="tb-pro">PRO</span>
  </div>
  <div class="tb-sep"></div>
  <input class="nb-name-inp" id="nb-name-inp" placeholder="Sin título" value="Nuevo Notebook">
  <div class="tb-right">
    <!-- Módulo 1 — input URL motor -->
    <input type="text" id="engine-url-input" class="engine-url-input" placeholder="https://...hf.space" onchange="setEngineURL(this.value)">
    <div class="eng-pill" id="eng-badge">● SIN COMPILADOR</div>
    <div class="admin-pill" id="admin-pill" style="display:none;">ADMIN+</div>
    <div class="user-pill" id="user-pill">—</div>
  </div>
</div>

<div class="secbar" id="secbar" style="display:none;">
  <button class="stab on" id="stab-1" onclick="setView('notebook')">📝 NOTEBOOK</button>
  <button class="stab" id="stab-2" onclick="setView('manage')">📂 MIS NOTEBOOKS</button>
  <div class="secbar-right">
    <button class="tbtn" onclick="addCellAt(-1,'code')" title="Añadir celda código">＋ Código</button>
    <button class="tbtn" onclick="addCellAt(-1,'markdown')" title="Añadir celda texto">＋ Texto</button>
    <button class="tbtn" onclick="importNb()" title="Subir .ipynb desde tu PC">📂 Abrir .ipynb</button>
    <input type="file" id="import-file" style="display:none;" accept=".ipynb" onchange="handleImport(event)">

<script>
// ══════════════════════════════════════════════════
// QCOL ARQUITECTO PROFESIONAL v3 — Con DeepSeek Full Implementation
// ══════════════════════════════════════════════════

let STANDALONE = window.parent === window;
let curUser = null;
let engineURL = '', engineOK = false, running = false;
let curView = 'notebook';
let cells = [];
let curCellId = null;
let execCounter = 0;
let _initialized = false;
let lastSaveTime = Date.now();
let debounceTimer = null;

function postCore(type, data={}){ try{ window.parent.postMessage({type,...data},'*'); }catch(e){} }
function notify(msg,ms=2800){ const el=document.getElementById('notif'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),ms); }

// Módulo 1 — checkEngine real
async function checkEngine(){
  if(!engineURL) return;
  const badge=document.getElementById('eng-badge');
  try{
    const resp=await fetch(engineURL+'/run/predict',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:[''], fn_index:1}),
      signal:AbortSignal.timeout(12000)
    });
    if(resp.ok){
      const raw=await resp.json();
      if(raw && raw.data && (raw.data[0] !== undefined)){
        engineOK=true;
        badge.textContent='● MOTOR ACTIVO';
        badge.className='eng-pill on';
      } else throw new Error('Respuesta inválida');
    } else throw new Error('HTTP '+resp.status);
  }catch(e){
    engineOK=false;
    badge.textContent='● SIN COMPILADOR';
    badge.className='eng-pill';
  }
}

function setEngineURL(url){
  engineURL=url;
  localStorage.setItem('qcol_colab_url',url);
  checkEngine();
  notify('🌐 Motor actualizado');
}

// Módulo 3 — drawCircuitBars
function drawCircuitBars(canvas, probabilities){
  if(!canvas || !probabilities) return;
  const states=Object.keys(probabilities);
  const values=Object.values(probabilities);
  const h=Math.max(120, states.length*32);
  canvas.width=600; canvas.height=h;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#090d18'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const maxProb=Math.max(...values,0.01);
  const barWidth=24; const startX=120; let y=20;
  for(let i=0;i<states.length;i++){
    const prob=values[i];
    const barLen=Math.max(2, (prob/maxProb)*(canvas.width-startX-80));
    ctx.fillStyle='#0088ff';
    const grad=ctx.createLinearGradient(startX,y,startX+barLen,y);
    grad.addColorStop(0,'#0088ff'); grad.addColorStop(1,'#00ffdd');
    ctx.fillStyle=grad;
    ctx.fillRect(startX,y,barLen,barWidth-4);
    ctx.fillStyle='#e2ecff';
    ctx.font='12px monospace';
    ctx.fillText(states[i], startX-70, y+16);
    ctx.fillStyle='#00ffdd';
    ctx.fillText((prob*100).toFixed(1)+'%', startX+barLen+8, y+16);
    y+=32;
  }
}

function drawPlot(canvas, base64png){
  if(!canvas || !base64png) return;
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.width; canvas.height=img.height;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,img.width,img.height);
  };
  img.src='data:image/png;base64,'+base64png;
}

function showUI(user){
  const newRole = user?.role || 'guest';
  const isUpgrade = _initialized && (newRole==='founder'||newRole==='admin') && (curUser?.role!=='founder' && curUser?.role!=='admin');
  if(_initialized && !isUpgrade) return;
  _initialized = true;
  curUser = user;
  const role = newRole;
  if(role !== 'admin' && role !== 'founder'){
    document.getElementById('access-denied').classList.add('show');
    document.getElementById('topbar').style.display='none';
    document.getElementById('secbar').style.display='none';
    document.getElementById('main-area').style.display='none';
    document.getElementById('statusbar').style.display='none';
    return;
  }
  document.getElementById('access-denied').classList.remove('show');
  ['topbar','secbar','main-area','statusbar'].forEach(id=>{ document.getElementById(id).style.display='flex'; });
  const pill = document.getElementById('user-pill');
  const ico = role==='founder'?'👑 ':role==='admin'?'🔑 ':'';
  pill.textContent = ico + (curUser.name||'—').split(' ')[0];
  document.getElementById('admin-pill').style.display='';
  // Módulo 1 — restaurar URL
  const storedURL = localStorage.getItem('qcol_colab_url')||'';
  if(storedURL){
    engineURL=storedURL;
    const urlInput=document.getElementById('engine-url-input');
    if(urlInput) urlInput.value=storedURL;
    checkEngine();
  }
  refreshNbs();
  if(cells.length===0) addCellAt(-1,'code');
}

window.addEventListener('message',e=>{
  const d = e.data||{};
  if(d.type==='QCOL_USER'){ showUI(d.user); }
  if(d.type==='QCOL_CONFIG_UPDATED'){ const url=localStorage.getItem('qcol_colab_url'); if(url){ engineURL=url; checkEngine(); } }
  if(d.type==='QCOL_LOAD_NB' && d.nb){
    if(!requireAuth()) return;
    const nb = d.nb;
    document.getElementById('nb-name-inp').value = nb.title||'Sin título';
    if(nb.cells && nb.cells.length>0){
      cells = nb.cells.map(c=>({...c, id:genId(), output:'', exec_count:null, mdEdit:false}));
      renderCells();
      if(cells[0]) focusCell(cells[0].id);
    } else { cells=[]; addCellAt(-1,'code'); }
    setView('notebook');
    notify('📂 Cargado: '+nb.title);
  }
});
postCore('QCOL_GET_USER');
setTimeout(()=>{ if(!_initialized){ const stored = localStorage.getItem('qcol_cur_user'); const user = stored ? JSON.parse(stored) : null; showUI(user); } }, 2000);
window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='QCOL_USER_UPDATE'){ const role=d.user?.role||'guest'; if(role==='admin'||role==='founder'){ _initialized=false; showUI(d.user); } } });

function requireAuth(){ const role=curUser?.role||'guest'; if(role!=='admin'&&role!=='founder'){ notify('❌ Requiere cuenta Admin o Founder'); postCore('QCOL_LOGIN'); return false; } return true; }

function genId(){ return 'c'+Date.now()+Math.random().toString(36).slice(2,6); }

function addCellAt(afterIdx, type='code'){
  const cell={id:genId(),type,code:type==='code'?'':'',output:'',exec_count:null,mdEdit:false};
  if(afterIdx===-1||afterIdx>=cells.length) cells.push(cell);
  else cells.splice(afterIdx+1,0,cell);
  renderCells();
  focusCell(cell.id);
  updateStatus();
}

function deleteCell(id){ if(cells.length<=1){ notify('Debes tener al menos 1 celda'); return; } cells=cells.filter(c=>c.id!==id); if(curCellId===id) curCellId=cells[0]?.id||null; renderCells(); updateStatus(); }
function moveCellUp(id){ const i=cells.findIndex(c=>c.id===id); if(i<=0) return; [cells[i-1],cells[i]]=[cells[i],cells[i-1]]; renderCells(); focusCell(id); }
function moveCellDown(id){ const i=cells.findIndex(c=>c.id===id); if(i<0||i>=cells.length-1) return; [cells[i],cells[i+1]]=[cells[i+1],cells[i]]; renderCells(); focusCell(id); }

function syncCellCode(id){ const cell=cells.find(c=>c.id===id); if(!cell) return; const ta=document.getElementById('ta-'+id); const mta=document.getElementById('mta-'+id); if(ta) cell.code=ta.value; if(mta) cell.code=mta.value; }
function focusCell(id){ curCellId=id; document.querySelectorAll('.nb-cell').forEach(el=>{ el.classList.toggle('active',el.dataset.id===id); }); const ta=document.getElementById('ta-'+id)||document.getElementById('mta-'+id); if(ta) ta.focus(); }

// Módulo 4 — renderizado markdown con preview y LaTeX
let md=null;
function initMarkdown(){ if(!window.markdownit) return; md=window.markdownit({html:true,linkify:true,highlight:function(str,lang){ if(lang && hljs.getLanguage(lang)){ try{ return hljs.highlight(str,{language:lang}).value; }catch(e){} } return ''; } }); }
async function renderMdPreview(cellId){
  const cell=cells.find(c=>c.id===cellId);
  if(!cell || cell.type!=='markdown') return;
  const previewDiv=document.getElementById(`md-preview-${cellId}`);
  if(!previewDiv) return;
  const src=cell.code||'';
  if(!md) initMarkdown();
  const html=md ? md.render(src) : `<pre>${escH(src)}</pre>`;
  previewDiv.innerHTML=html;
  if(window.hljs) document.querySelectorAll('#md-preview-'+cellId+' pre code').forEach((block)=>{ hljs.highlightElement(block); });
  if(window.MathJax){ try{ await window.MathJax.typesetPromise([previewDiv]); }catch(e){} }
}

function editMd(id){ const cell=cells.find(c=>c.id===id); if(cell){ cell.mdEdit=true; renderCells(); focusCell(id); } }

function renderCells(){
  const scroll=document.getElementById('nb-scroll');
  const bottom=scroll.querySelector('.nb-bottom');
  scroll.querySelectorAll('.nb-cell,.add-cell-row').forEach(el=>el.remove());
  cells.forEach((cell,i)=>{ const row=buildAddRow(i-1); scroll.insertBefore(row,bottom); const el=buildCellEl(cell,i); scroll.insertBefore(el,bottom); });
  const row=buildAddRow(cells.length-1);
  scroll.insertBefore(row,bottom);
  if(curCellId) focusCell(curCellId);
  updateStatus();
}

function buildAddRow(afterIdx){
  const row=document.createElement('div'); row.className='add-cell-row';
  row.innerHTML=`<div class="add-cell-line"></div><div class="add-cell-btns"><button class="add-btn" onclick="addCellAt(${afterIdx},'code')">＋ Código</button><button class="add-btn" onclick="addCellAt(${afterIdx},'markdown')">＋ Texto</button></div><div class="add-cell-line"></div>`;
  return row;
}

function buildCellEl(cell,i){
  const el=document.createElement('div');
  el.className='nb-cell'+(curCellId===cell.id?' active':'');
  el.dataset.id=cell.id;
  el.draggable=true;
  el.onclick=()=>focusCell(cell.id);
  el.ondragstart=e=>{ dragSrcId=cell.id; e.dataTransfer.setData('text/plain',cell.id); };
  el.ondragend=e=>{ dragSrcId=null; document.querySelectorAll('.nb-cell').forEach(c=>c.classList.remove('drag-over')); };
  el.ondragover=e=>{ e.preventDefault(); if(dragSrcId && dragSrcId!==cell.id) e.dataTransfer.dropEffect='move'; };
  el.ondrop=e=>{ e.preventDefault(); if(!dragSrcId||dragSrcId===cell.id) return; const srcIdx=cells.findIndex(c=>c.id===dragSrcId); const dstIdx=cells.findIndex(c=>c.id===cell.id); if(srcIdx<0||dstIdx<0) return; const [moved]=cells.splice(srcIdx,1); cells.splice(dstIdx,0,moved); renderCells(); focusCell(dragSrcId); notify('↕ Celda movida'); };
  const isCode=cell.type==='code';
  const execLbl=cell.exec_count!==null?`[${cell.exec_count}]`:'[ ]';
  const toolbar=`<div class="cell-toolbar"><button class="ct-btn" onclick="event.stopPropagation();moveCellUp('${cell.id}')">↑</button><button class="ct-btn" onclick="event.stopPropagation();moveCellDown('${cell.id}')">↓</button><button class="ct-btn" onclick="event.stopPropagation();changeCellType('${cell.id}')">${isCode?'Md':'{ }'}</button><button class="ct-btn danger" onclick="event.stopPropagation();deleteCell('${cell.id}')">✕</button></div>`;
  if(isCode){
    const highlighted=highlight(cell.code||'');
    el.innerHTML=`${toolbar}<div class="cell-gutter"><div class="cell-num">${execLbl}</div><button class="cell-run-btn" id="rbtn-${cell.id}" onclick="event.stopPropagation();runCell('${cell.id}')">▶</button></div><div class="cell-body"><div class="cell-type-badge ctb-code">{ } Python</div><div class="cell-code-area" id="area-${cell.id}"><div class="cell-syn-layer" id="syn-${cell.id}">${highlighted}</div><textarea class="cell-textarea" id="ta-${cell.id}" spellcheck="false" oninput="onCellInput('${cell.id}')" onkeydown="onCellKeydown(event,'${cell.id}')" onfocus="focusCell('${cell.id}')">${escH(cell.code||'')}</textarea></div><div class="cell-output-area" id="output-area-${cell.id}"></div></div>`;
  } else {
    if(cell.mdEdit){
      el.innerHTML=`${toolbar}<div class="cell-gutter"><div class="cell-num" style="color:var(--gr)">Md</div></div><div class="cell-body"><div class="cell-type-badge ctb-md">✦ Markdown / LaTeX</div><div class="md-split"><div class="md-editor-pane"><textarea class="cell-md-split-area" id="mta-${cell.id}" placeholder="# Título&#10;Escribe Markdown o LaTeX: $E=mc^2$" oninput="syncCellCode('${cell.id}');renderMdPreview('${cell.id}')" onkeydown="onMdKeydown(event,'${cell.id}')" rows="6">${escH(cell.code||'')}</textarea></div><div class="md-preview-pane" id="md-preview-${cell.id}"></div></div></div>`;
      setTimeout(()=>renderMdPreview(cell.id),10);
    } else {
      el.innerHTML=`${toolbar}<div class="cell-gutter"><div class="cell-num" style="color:var(--gr)">Md</div></div><div class="cell-body"><div class="cell-type-badge ctb-md">✦ Markdown</div><div class="cell-md-rendered" id="mren-${cell.id}" ondblclick="editMd('${cell.id}')">${renderMd(cell.code||'')}</div></div>`;
    }
  }
  setTimeout(()=>{ const ta=document.getElementById('ta-'+cell.id); if(ta) autoResize(ta); },0);
  return el;
}

function onMdKeydown(e,id){ if(e.key==='Escape'){ syncCellCode(id); const cell=cells.find(c=>c.id===id); if(cell){ cell.mdEdit=false; renderCells(); } } if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); syncCellCode(id); const cell=cells.find(c=>c.id===id); if(cell){ cell.mdEdit=false; renderCells(); } const idx=cells.findIndex(c=>c.id===id); if(idx<cells.length-1) focusCell(cells[idx+1].id); } }

function escH(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(code){ const KW=['import','from','as','def','class','return','if','else','elif','for','while','in','not','and','or','True','False','None','with','try','except','finally','lambda','pass','break','continue','yield','raise','del','global','assert']; let h=escH(code); h=h.replace(/(#[^\n]*)/g,'<span class="cm">$1</span>'); h=h.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"]*"|'[^']*')/g,'<span class="st">$1</span>'); h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>'); KW.forEach(k=>{ const re=new RegExp(`\\b(${k})\\b`,'g'); h=h.replace(re,'<span class="kw">$1</span>'); }); h=h.replace(/\b([A-Za-z_][A-Za-z0-9_]*)\s*(?=\()/g,'<span class="fn">$1</span>'); return h; }
function onCellInput(id){ const ta=document.getElementById('ta-'+id); const syn=document.getElementById('syn-'+id); if(ta&&syn){ const cell=cells.find(c=>c.id===id); if(cell) cell.code=ta.value; syn.innerHTML=highlight(ta.value); autoResize(ta); syn.scrollTop=ta.scrollTop; syn.scrollLeft=ta.scrollLeft; } if(debounceTimer) clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>{ if(curUser&&cells.length) saveCurrentNb(false); },3000); }
function autoResize(ta){ ta.style.height='auto'; const h=Math.max(48,ta.scrollHeight); ta.style.height=h+'px'; const area=ta.closest('.cell-code-area'); if(area) area.style.height=h+'px'; const syn=ta.parentElement?.querySelector('.cell-syn-layer'); if(syn) syn.style.height=h+'px'; }
function onCellKeydown(e,id){ const ta=document.getElementById('ta-'+id); if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.substring(0,s)+'    '+ta.value.substring(en); ta.selectionStart=ta.selectionEnd=s+4; onCellInput(id); return; } if(e.shiftKey&&e.key==='Enter'){ e.preventDefault(); runCell(id); const idx=cells.findIndex(c=>c.id===id); if(idx<cells.length-1) focusCell(cells[idx+1].id); else addCellAt(-1,'code'); return; } if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runCell(id); } }
function changeCellType(id){ const cell=cells.find(c=>c.id===id); if(!cell) return; cell.type=cell.type==='code'?'markdown':'code'; cell.mdEdit=true; renderCells(); focusCell(id); }
function renderMd(text){ let html=escH(text); html=html.replace(/^### (.+)/gm,'<h3>$1</h3>'); html=html.replace(/^## (.+)/gm,'<h2>$1</h2>'); html=html.replace(/^# (.+)/gm,'<h1>$1</h1>'); html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); html=html.replace(/\*(.+?)\*/g,'<em>$1</em>'); html=html.replace(/`(.+?)`/g,'<code>$1</code>'); html=html.replace(/\n/g,'<br>'); return html; }

// Módulo 2 + 3 — ejecución con output rico
async function runCell(id){
  if(!requireAuth()) return;
  if(running){ notify('Ya hay una ejecución en curso'); return; }
  const cell=cells.find(c=>c.id===id);
  if(!cell||cell.type!=='code') return;
  syncCellCode(id);
  const code=cell.code.trim();
  if(!code) return;
  running=true;
  setSbRun(true);
  const rbtn=document.getElementById('rbtn-'+id);
  if(rbtn) rbtn.classList.add('spinning');
  const outArea=document.getElementById(`output-area-${id}`);
  if(outArea) outArea.innerHTML='<div class="out-text out-inf">⚙️ Ejecutando...</div>';
  try{
    if(engineOK&&engineURL){
      const resp=await fetch(engineURL+'/run/predict',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({data:[code], fn_index:1}),
        signal:AbortSignal.timeout(90000)
      });
      const raw=await resp.json();
      const d=raw.data?raw.data[0]:{};
      execCounter++;
      cell.exec_count=execCounter;
      if(outArea){
        let outHtml='';
        if(d.success){
          outHtml+=`<div class="out-text out-ok">${escH(d.output||'✅ OK')}</div>`;
        } else {
          outHtml+=`<div class="out-text out-err">❌ ${escH(d.output||'Error')}</div>`;
        }
        if(d.bloch && d.bloch.probabilities){
          const canvasId=`circuit-canvas-${id}`;
          outHtml+=`<canvas id="${canvasId}" class="out-circuit"></canvas>`;
          outArea.innerHTML=outHtml;
          const canvas=document.getElementById(canvasId);
          drawCircuitBars(canvas, d.bloch.probabilities);
        } else if(d.plot_png){
          const canvasId=`plot-canvas-${id}`;
          outHtml+=`<canvas id="${canvasId}" class="out-plot"></canvas>`;
          outArea.innerHTML=outHtml;
          const canvas=document.getElementById(canvasId);
          drawPlot(canvas, d.plot_png);
        } else {
          outArea.innerHTML=outHtml;
        }
      }
      setSbRun(false,'✅ Completado');
    } else {
      await new Promise(r=>setTimeout(r,600));
      execCounter++;
      cell.exec_count=execCounter;
      if(outArea) outArea.innerHTML=`<div class="out-text out-inf">⚡ Simulación local · Configura el motor en la barra superior</div>`;
      setSbRun(false,'Simulación local');
    }
  } catch(e){
    if(outArea) outArea.innerHTML=`<div class="out-text out-err">❌ ${e.name==='TimeoutError'?'Tiempo agotado':e.message}</div>`;
    setSbRun(false,'❌ Error','err');
  }
  running=false;
  if(rbtn) rbtn.classList.remove('spinning');
  renderCellNum(id);
}
function renderCellNum(id){ const cell=cells.find(c=>c.id===id); if(!cell) return; const numEl=document.querySelector(`[data-id="${id}"] .cell-num`); if(numEl) numEl.textContent=cell.exec_count!==null?`[${cell.exec_count}]`:'[ ]'; }
async function runCurCell(){ if(curCellId) await runCell(curCellId); }
async function runAll(){ for(const cell of cells){ if(cell.type==='code'&&cell.code.trim()){ await runCell(cell.id); await new Promise(r=>setTimeout(r,200)); } } }
function setSbRun(running,msg='',state=''){ const dot=document.getElementById('sb-dot'); const txt=document.getElementById('sb-txt'); if(dot) dot.className='sb-dot '+(running?'sb-run':state==='err'?'sb-err':'sb-idle'); if(txt&&msg) txt.textContent=msg; }
function updateStatus(){ const el=document.getElementById('sb-cells-info'); if(el) el.textContent=cells.length+' celdas'; }

// Módulo 5 — guardado con timestamp
function saveCurrentNb(showNotify=true){
  if(!curUser) return;
  cells.forEach(c=>{ const ta=document.getElementById('ta-'+c.id); const mta=document.getElementById('mta-'+c.id); if(ta) c.code=ta.value; if(mta) c.code=mta.value; });
  const name=document.getElementById('nb-name-inp').value||'Sin título';
  const key='qcol_nbs_'+(curUser.username||'dev');
  const nbs=JSON.parse(localStorage.getItem(key)||'[]');
  const existing=nbs.findIndex(n=>n.name===name);
  const entry={name,cells:JSON.parse(JSON.stringify(cells)),saved:new Date().toISOString()};
  if(existing>=0) nbs[existing]=entry; else nbs.unshift(entry);
  localStorage.setItem(key,JSON.stringify(nbs.slice(0,50)));
  lastSaveTime=Date.now();
  const saveSpan=document.getElementById('sb-save-status');
  if(saveSpan) saveSpan.textContent='💾 Guardado';
  setTimeout(()=>{ if(saveSpan) saveSpan.textContent='✓'; },2000);
  if(showNotify) notify('💾 Guardado: '+name);
}
setInterval(()=>{ if(curUser&&cells.length>0){ const mins=Math.floor((Date.now()-lastSaveTime)/60000); const saveSpan=document.getElementById('sb-save-status'); if(saveSpan) saveSpan.textContent=mins>0?`⏱️ hace ${mins}min`:'✓'; } },60000);
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveCurrentNb(true); } if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='Enter'){ e.preventDefault(); runAll(); } });

function newNotebook(){ if(!confirm('¿Crear nuevo notebook? Se perderá el actual.')) return; cells=[];execCounter=0;curCellId=null; document.getElementById('nb-name-inp').value='Nuevo Notebook'; addCellAt(-1,'code'); notify('✅ Nuevo notebook'); }
function importNb(){ document.getElementById('import-file').click(); }
function handleImport(e){ const file=e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=ev=>{ try{ const nb=JSON.parse(ev.target.result); cells=[];execCounter=0; const name=nb.metadata?.name||file.name.replace('.ipynb',''); document.getElementById('nb-name-inp').value=name; (nb.cells||[]).forEach(c=>{ const src=Array.isArray(c.source)?c.source.join(''):c.source||''; const type=c.cell_type==='markdown'?'markdown':'code'; cells.push({id:genId(),type,code:src,output:'',exec_count:null,mdEdit:false}); }); if(cells.length===0) addCellAt(-1,'code'); else { renderCells(); focusCell(cells[0].id); } setView('notebook'); notify(`✅ Importado: ${name} (${cells.length} celdas)`); }catch(err){ notify('❌ Error al leer .ipynb: '+err.message); } }; reader.readAsText(file); e.target.value=''; }
function downloadNb(){ const name=document.getElementById('nb-name-inp').value||'qcol_notebook'; cells.forEach(c=>{ const ta=document.getElementById('ta-'+c.id); const mta=document.getElementById('mta-'+c.id); if(ta) c.code=ta.value; if(mta) c.code=mta.value; }); const nb={nbformat:4,nbformat_minor:5,metadata:{name,kernelspec:{display_name:'Python 3',language:'python',name:'python3'},qcol:{lib:'qiskit',author:curUser?.name||'',created:new Date().toISOString()}},cells:cells.map(c=>({cell_type:c.type==='markdown'?'markdown':'code',source:[c.code],metadata:{},outputs:[],execution_count:c.exec_count}))}; const blob=new Blob([JSON.stringify(nb,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.replace(/\.ipynb$/,'')+'.ipynb'; a.click(); notify('📥 '+a.download); }
function getSavedNbs(){ if(!curUser) return []; const key='qcol_nbs_'+(curUser.username||'dev'); return JSON.parse(localStorage.getItem(key)||'[]'); }
function loadNb(name){ const nbs=getSavedNbs(); const nb=nbs.find(n=>n.name===name); if(!nb) return; cells=nb.cells.map(c=>({...c,mdEdit:false})); document.getElementById('nb-name-inp').value=nb.name; renderCells(); if(cells[0]) focusCell(cells[0].id); setView('notebook'); notify('📂 Cargado: '+nb.name); }
function deleteNb(name){ if(!confirm('¿Eliminar "'+name+'"?')) return; const key='qcol_nbs_'+(curUser?.username||'dev'); const nbs=getSavedNbs().filter(n=>n.name!==name); localStorage.setItem(key,JSON.stringify(nbs)); refreshNbs(); notify('🗑 Eliminado: '+name); }
function refreshNbs(){ const grid=document.getElementById('nb-grid'); if(!grid) return; const nbs=getSavedNbs(); if(nbs.length===0){ grid.innerHTML=`<div class="nb-empty-state"><div class="nb-empty-icon">📓</div><div class="nb-empty-ttl">Sin notebooks guardados</div><div class="nb-empty-sub">Crea tu primer notebook o importa un .ipynb</div></div>`; return; } grid.innerHTML=nbs.map(nb=>`<div class="nb-card"><div class="nb-card-hdr"><div class="nb-card-title">${escH(nb.name)}</div><div class="nb-card-badge">${nb.cells?.length||0} celdas</div></div><div class="nb-card-body"><div class="nb-card-meta">${new Date(nb.saved).toLocaleDateString()}</div><div class="nb-card-actions"><button class="btn-edit-nb" onclick="loadNb('${escH(nb.name)}')">📝 Editar</button><button class="btn-pub-nb" onclick="loadNb('${escH(nb.name)}');showPublish()">📤 Publicar</button><button class="btn-del-nb" onclick="deleteNb('${escH(nb.name)}')">🗑</button></div></div></div>`).join(''); }
function showPublish(){ const name=document.getElementById('nb-name-inp').value||''; document.getElementById('pub-title').value=name; document.getElementById('pub-modal').classList.add('open'); }
function closePublish(){ document.getElementById('pub-modal').classList.remove('open'); }
function publishNb(){ if(!requireAuth()) return; saveCurrentNb(false); const name=document.getElementById('nb-name-inp').value||'Sin título'; const desc=document.getElementById('pub-desc').value.trim(); const tags=document.getElementById('pub-tags').value.trim(); const id=name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''); const projs=JSON.parse(localStorage.getItem('qcol_projs')||'[]'); const existing=projs.findIndex(p=>p.id===id); const entry={id,title:name,type:'nb',desc,tags,size:cells.length,time:Math.max(5,cells.length*2),added:new Date().toLocaleDateString(),author:curUser?.name||'Admin',cells:JSON.parse(JSON.stringify(cells))}; if(existing>=0) projs[existing]=entry; else projs.unshift(entry); localStorage.setItem('qcol_projs',JSON.stringify(projs)); postCore('QCOL_SAVE',{key:'qcol_projs',val:projs}); downloadNb(); closePublish(); notify('✅ Publicado en Proyectos: '+name); }
function setView(v){ curView=v; document.getElementById('view-notebook').style.display=v==='notebook'?'flex':'none'; document.getElementById('view-manage').style.display=v==='manage'?'flex':'none'; document.getElementById('stab-1').classList.toggle('on',v==='notebook'); document.getElementById('stab-2').classList.toggle('on',v==='manage'); if(v==='manage') refreshNbs(); }

// Módulo 1 — initEngine al final
function initEngine(){
  const stored=localStorage.getItem('qcol_colab_url');
  if(stored){
    engineURL=stored;
    const urlInput=document.getElementById('engine-url-input');
    if(urlInput) urlInput.value=stored;
    checkEngine();
  }
}
initEngine();
setTimeout(()=>{ initMarkdown(); },500);
</script>
